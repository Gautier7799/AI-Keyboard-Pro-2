              private fun createIosKeyDrawable(faceColor: Int, pressedColor: Int): StateListDrawable {
                  val dp = resources.displayMetrics.density
                  val radius = 5f * dp
                  val shadowHeight = (1.2f * dp).toInt() 
                  val normalFace = GradientDrawable().apply { setShape(GradientDrawable.RECTANGLE); setColor(faceColor); setCornerRadius(radius) }
                  val shadow = GradientDrawable().apply { setShape(GradientDrawable.RECTANGLE); setColor(keyShadow); setCornerRadius(radius) }
                  val normalLayer = LayerDrawable(arrayOf(shadow, normalFace)).apply { setLayerInset(1, 0, 0, 0, shadowHeight) }
                  val pressedFace = GradientDrawable().apply { setShape(GradientDrawable.RECTANGLE); setColor(pressedColor); setCornerRadius(radius) }
                  val pressedLayer = LayerDrawable(arrayOf(shadow, pressedFace)).apply { setLayerInset(1, 0, shadowHeight/2, 0, shadowHeight/2) }
                  return StateListDrawable().apply { addState(intArrayOf(android.R.attr.state_pressed), pressedLayer); addState(intArrayOf(), normalLayer) }
              }

              override fun onUpdateSelection(oldSelStart: Int, oldSelEnd: Int, newSelStart: Int, newSelEnd: Int, candidatesStart: Int, candidatesEnd: Int) {
                  super.onUpdateSelection(oldSelStart, oldSelEnd, newSelStart, newSelEnd, candidatesStart, candidatesEnd)
                  handler.post { updatePredictions() }
              }

              private fun updatePredictions() {
                  val ic = currentInputConnection
                  if (ic == null) { predictionViews.forEach { it.text = "" }; return }
                  val textBeforeCursor = ic.getTextBeforeCursor(20, 0)?.toString() ?: ""
                  val lastWord = textBeforeCursor.takeLastWhile { it.isLetter() }
                  val activeDict = if(currentLanguage == 0) dictionaryAr else dictionaryFr
                  val suggestions = if (lastWord.isEmpty()) { if(currentLanguage == 0) listOf("في", "كيف", "نعم") else listOf("Je", "Comment", "Oui") } else {
                      val matches = activeDict.filter { it.startsWith(lastWord, ignoreCase = true) && !it.equals(lastWord, ignoreCase = true) }.take(2).toMutableList()
                      listOf(if (matches.size > 0) matches[0] else "", lastWord, if (matches.size > 1) matches[1] else "")
                  }
                  
                  predictionViews.forEachIndexed { index, tv ->
                      if (index < suggestions.size) tv.text = suggestions[index]
                      tv.setOnTouchListener { v, event ->
                          if (event.action == MotionEvent.ACTION_DOWN && suggestions[index].isNotEmpty()) {
                              vibrateAndSound(v); if (lastWord.isNotEmpty()) ic.deleteSurroundingText(lastWord.length, 0)
                              ic.commitText(suggestions[index] + " ", 1); handler.postDelayed({ updatePredictions() }, 50)
                          }
                          true
                      }
                  }
              }

              private fun updateOptionsPopupSelection(rawX: Float) {
                  var newSelectedIndex = -1
                  for (i in 0 until optionsContainer.childCount) {
                      val child = optionsContainer.getChildAt(i); val loc = IntArray(2); child.getLocationOnScreen(loc)
                      if (rawX >= loc[0] && rawX <= loc[0] + child.width) { newSelectedIndex = i; break }
                  }
                  if (newSelectedIndex != selectedOptionIndex) {
                      if (selectedOptionIndex != -1 && selectedOptionIndex < optionsContainer.childCount) { (optionsContainer.getChildAt(selectedOptionIndex).background as GradientDrawable).setColor(Color.TRANSPARENT); (optionsContainer.getChildAt(selectedOptionIndex) as TextView).setTextColor(txtColor) }
                      if (newSelectedIndex != -1 && newSelectedIndex < optionsContainer.childCount) { (optionsContainer.getChildAt(newSelectedIndex).background as GradientDrawable).setColor(Color.parseColor("#007AFF")); (optionsContainer.getChildAt(newSelectedIndex) as TextView).setTextColor(Color.WHITE) }
                      selectedOptionIndex = newSelectedIndex
                  }
              }

              private fun createIconKey(iconResId: Int, faceColor: Int, pressedColor: Int, weight: Float): View {
                  val dp = resources.displayMetrics.density
                  return FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), weight); background = createIosKeyDrawable(faceColor, pressedColor)
                      addView(ImageView(this@KeyboardService).apply { layoutParams = FrameLayout.LayoutParams((24*dp).toInt(), (24*dp).toInt()).apply { gravity = Gravity.CENTER }; setImageResource(iconResId); setColorFilter(txtColor) })
                      setOnTouchListener { v, event -> if (event.action == MotionEvent.ACTION_DOWN) v.isPressed = true else if (event.action == MotionEvent.ACTION_UP || event.action == MotionEvent.ACTION_CANCEL) v.isPressed = false; false }
                  }
              }

              private fun renderKeys() {
                  keysContainer.removeAllViews()
                  val dp = resources.displayMetrics.density
                  val gap = (4 * dp).toInt(); val rowGap = (10 * dp).toInt() 
                  
                  if (keyboardMode == 0) { 
                      val r1 = if(currentLanguage == 0) listOf("ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج") else listOf("a","z","e","r","t","y","u","i","o","p")
                      val r2 = if(currentLanguage == 0) listOf("ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط") else listOf("q","s","d","f","g","h","j","k","l","m")
                      val r3 = if(currentLanguage == 0) listOf("ظ","ز","و","ة","ى","ر","د") else listOf("w","x","c","v","b","n")
                      val displayR1 = if (isShifted && currentLanguage == 1) r1.map { it.uppercase() } else r1
                      val displayR2 = if (isShifted && currentLanguage == 1) r2.map { it.uppercase() } else r2
                      val displayR3 = if (isShifted && currentLanguage == 1) r3.map { it.uppercase() } else r3

                      keysContainer.addView(createKeysRow(displayR1, gap, 0.05f))
                      keysContainer.addView(Space(rowGap))
                      keysContainer.addView(createKeysRow(displayR2, gap, if(currentLanguage == 0) 0.05f else 0.5f))
                      keysContainer.addView(Space(rowGap))

                      val row3Container = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                      row3Container.addView(Space((3*dp).toInt(), true))
                      row3Container.addView(createIconKey(R.drawable.ic_shift, if (isShifted) keyNormalFace else keyControlFace, if (isShifted) keyNormalPressed else keyControlPressed, 1.3f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN) { vibrateAndSound(v); isShifted = !isShifted; renderKeys() }; true } })
                      row3Container.addView(Space(gap, true))
                      displayR3.forEach { char -> row3Container.addView(createKey(char)); row3Container.addView(Space(gap, true)) }
                      row3Container.addView(createIconKey(R.drawable.ic_backspace, keyControlFace, keyControlPressed, 1.3f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN) { v.isPressed = true; vibrateAndSound(v); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); handler.postDelayed({ updatePredictions() }, 50) } else if(e.action==MotionEvent.ACTION_UP || e.action==MotionEvent.ACTION_CANCEL) { v.isPressed = false }; true } })
                      row3Container.addView(Space((3*dp).toInt(), true))
                      keysContainer.addView(row3Container); keysContainer.addView(Space(rowGap))

                      val bottomRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                      bottomRow.addView(Space((3*dp).toInt(), true))
                      bottomRow.addView(createSpecialKey("123", keyControlFace, keyControlPressed, 1.4f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); keyboardMode = 1; renderKeys() }; true } })
                      bottomRow.addView(Space(gap, true))
                      bottomRow.addView(createIconKey(R.drawable.ic_globe, keyControlFace, keyControlPressed, 1.2f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN) { vibrateAndSound(v); currentLanguage = if(currentLanguage == 0) 1 else 0; renderKeys() }; true } })
                      bottomRow.addView(Space(gap, true))
                      bottomRow.addView(createSpecialKey(if(currentLanguage == 0) "مسافة" else "espace", keyNormalFace, keyNormalPressed, 5f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); currentInputConnection?.commitText(" ", 1); handler.postDelayed({ updatePredictions() }, 50) }; true } })
                      bottomRow.addView(Space(gap, true))
                      bottomRow.addView(createIconKey(R.drawable.ic_enter, keyControlFace, keyControlPressed, 1.4f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN) { v.isPressed = true; vibrateAndSound(v); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) } else if(e.action==MotionEvent.ACTION_UP || e.action==MotionEvent.ACTION_CANCEL) { v.isPressed = false }; true } })
                      bottomRow.addView(Space((3*dp).toInt(), true))
                      keysContainer.addView(bottomRow)
                      
                  } else { 
                      val r1 = if(keyboardMode == 1) listOf("1","2","3","4","5","6","7","8","9","0") else listOf("[","]","{","}","#","%","^","*","+","=")
                      val r2 = if(keyboardMode == 1) listOf("-","/",":",";","(",")","$","&","@","\"") else listOf("_","\\","|","~","<",">","€","£","¥","•")
                      val r3 = listOf(".",",","?","!","'")

                      keysContainer.addView(createKeysRow(r1, gap, 0.05f)); keysContainer.addView(Space(rowGap))
                      keysContainer.addView(createKeysRow(r2, gap, 0.05f)); keysContainer.addView(Space(rowGap))

                      val row3Container = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                      row3Container.addView(Space((3*dp).toInt(), true))
                      row3Container.addView(createSpecialKey(if(keyboardMode == 1) "#+=" else "123", keyControlFace, keyControlPressed, 1.3f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); keyboardMode = if(keyboardMode == 1) 2 else 1; renderKeys() }; true } })
                      row3Container.addView(Space(gap, true))
                      r3.forEach { char -> row3Container.addView(createKey(char, weight = 1.2f)); row3Container.addView(Space(gap, true)) }
                      row3Container.addView(createIconKey(R.drawable.ic_backspace, keyControlFace, keyControlPressed, 1.3f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN) { v.isPressed = true; vibrateAndSound(v); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); handler.postDelayed({ updatePredictions() }, 50) } else if(e.action==MotionEvent.ACTION_UP || e.action==MotionEvent.ACTION_CANCEL) { v.isPressed = false }; true } })
                      row3Container.addView(Space((3*dp).toInt(), true))
                      keysContainer.addView(row3Container); keysContainer.addView(Space(rowGap))

                      val bottomRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                      bottomRow.addView(Space((3*dp).toInt(), true))
                      bottomRow.addView(createSpecialKey(if(currentLanguage == 0) "أ ب ج" else "ABC", keyControlFace, keyControlPressed, 1.4f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); keyboardMode = 0; renderKeys() }; true } })
                      bottomRow.addView(Space(gap, true))
                      bottomRow.addView(createIconKey(R.drawable.ic_globe, keyControlFace, keyControlPressed, 1.2f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN) { vibrateAndSound(v); currentLanguage = if(currentLanguage == 0) 1 else 0; renderKeys() }; true } })
                      bottomRow.addView(Space(gap, true))
                      bottomRow.addView(createSpecialKey(if(currentLanguage == 0) "مسافة" else "espace", keyNormalFace, keyNormalPressed, 5f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); currentInputConnection?.commitText(" ", 1); handler.postDelayed({ updatePredictions() }, 50) }; true } })
                      bottomRow.addView(Space(gap, true))
                      bottomRow.addView(createIconKey(R.drawable.ic_enter, keyControlFace, keyControlPressed, 1.4f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN) { v.isPressed = true; vibrateAndSound(v); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) } else if(e.action==MotionEvent.ACTION_UP || e.action==MotionEvent.ACTION_CANCEL) { v.isPressed = false }; true } })
                      bottomRow.addView(Space((3*dp).toInt(), true))
                      keysContainer.addView(bottomRow)
                  }
              }

              private fun createKey(char: String, weight: Float = 1f): TextView {
                  val dp = resources.displayMetrics.density
                  return TextView(this).apply {
                      text = char; textSize = 25f; setTextColor(txtColor); gravity = Gravity.CENTER; typeface = Typeface.create("sans-serif", Typeface.NORMAL)
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), weight); background = createIosKeyDrawable(keyNormalFace, keyNormalPressed)
                      
                      val alternates = alternateChars[char.lowercase()] ?: emptyList()
                      var isLongPressActive = false; var initialRawX = 0f
                      val longPressRunnable = Runnable {
                          if (alternates.isNotEmpty()) {
                              isLongPressActive = true; vibrateAndSound(this); popupView.visibility = View.GONE; optionsContainer.removeAllViews()
                              alternates.forEach { alt -> optionsContainer.addView(TextView(this@KeyboardService).apply { text = alt; textSize = 26f; setTextColor(txtColor); gravity = Gravity.CENTER; layoutParams = LinearLayout.LayoutParams((42 * dp).toInt(), (50 * dp).toInt()); background = GradientDrawable().apply { setColor(Color.TRANSPARENT); setCornerRadius(6f * dp) } }) }
                              optionsContainer.measure(View.MeasureSpec.UNSPECIFIED, View.MeasureSpec.UNSPECIFIED)
                              val loc = IntArray(2); this.getLocationInWindow(loc)
                              var popupX = loc[0].toFloat() - (optionsContainer.measuredWidth - this.width) / 2
                              if (popupX < 4f * dp) popupX = 4f * dp
                              if (popupX + optionsContainer.measuredWidth > resources.displayMetrics.widthPixels) popupX = resources.displayMetrics.widthPixels.toFloat() - optionsContainer.measuredWidth - (4f * dp)
                              optionsContainer.x = popupX; optionsContainer.y = loc[1].toFloat() - optionsContainer.measuredHeight - (10 * dp); optionsContainer.visibility = View.VISIBLE
                              updateOptionsPopupSelection(initialRawX)
                          }
                      }
                      
                      setOnTouchListener { v, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialRawX = event.rawX; v.isPressed = true; vibrateAndSound(v); isLongPressActive = false
                                  val loc = IntArray(2); v.getLocationInWindow(loc)
                                  popupView.layoutParams = FrameLayout.LayoutParams(v.width + (8 * dp).toInt(), (50 * dp).toInt())
                                  popupView.text = char; popupView.x = loc[0].toFloat() - 4f * dp; popupView.y = loc[1].toFloat() - (50 * dp) - (2 * dp); popupView.visibility = View.VISIBLE
                                  handler.postDelayed(longPressRunnable, 350); true
                              }
                              MotionEvent.ACTION_MOVE -> { if (isLongPressActive) updateOptionsPopupSelection(event.rawX); true }
                              MotionEvent.ACTION_UP -> {
                                  handler.removeCallbacks(longPressRunnable); v.isPressed = false
                                  if (isLongPressActive) { optionsContainer.visibility = View.GONE; currentInputConnection?.commitText(if (selectedOptionIndex != -1 && selectedOptionIndex < alternates.size) alternates[selectedOptionIndex] else char, 1) } 
                                  else { popupView.visibility = View.GONE; currentInputConnection?.commitText(char, 1) }
                                  handler.postDelayed({ updatePredictions() }, 50); true
                              }
                              MotionEvent.ACTION_CANCEL -> { handler.removeCallbacks(longPressRunnable); v.isPressed = false; popupView.visibility = View.GONE; optionsContainer.visibility = View.GONE; true }
                              else -> false
                          }
                      }
                  }
              }

              private fun createSpecialKey(label: String, faceColor: Int, pressedColor: Int, weight: Float): TextView {
                  val dp = resources.displayMetrics.density
                  return TextView(this).apply {
                      text = label; textSize = if (label == "مسافة" || label == "espace" || label.contains("ABC")) 16f else 20f
                      setTextColor(if (label == "مسافة" || label == "espace" || label.contains("ABC")) txtColor else Color.BLACK); gravity = Gravity.CENTER
                      typeface = if (label == "مسافة" || label == "espace" || label.contains("ABC")) Typeface.create("sans-serif", Typeface.NORMAL) else Typeface.DEFAULT_BOLD
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), weight)
                      background = createIosKeyDrawable(faceColor, pressedColor)
                  }
              }

              private fun createKeysRow(keys: List<String>, gap: Int, edgeWeight: Float): LinearLayout {
                  val dp = resources.displayMetrics.density
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      if (edgeWeight > 0f) addView(View(this@KeyboardService).apply { layoutParams = LinearLayout.LayoutParams(0, 1, edgeWeight) }) else addView(Space((3*dp).toInt(), true))
                      keys.forEachIndexed { index, char -> addView(createKey(char)); if (index < keys.size - 1) addView(Space(gap, true)) }
                      if (edgeWeight > 0f) addView(View(this@KeyboardService).apply { layoutParams = LinearLayout.LayoutParams(0, 1, edgeWeight) }) else addView(Space((3*dp).toInt(), true))
                  }
              }

              private fun vibrateAndSound(view: View) { view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); view.playSoundEffect(SoundEffectConstants.CLICK) }
              private fun Space(size: Int, isHorizontal: Boolean = false): View { return View(this).apply { layoutParams = if (isHorizontal) LinearLayout.LayoutParams(size, 1) else LinearLayout.LayoutParams(1, size) } }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:exported="true" android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro-Ultimate
          path: release-output/AI-Keyboard-Pro.apk
          retention-days: 5
