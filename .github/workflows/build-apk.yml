name: Build & Publish AI Keyboard Pro 2 (V2.0)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build-and-publish:
    name: Generate, Build & Release AI Keyboard Pro 2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate AI Keyboard Pro 2 Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/aikeyboard/pro app/src/main/res/mipmap-anydpi-v26

          # --- Gradle & Project Setup ---
          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AiKeyboardPro2"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 20; versionName = "2.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.foundation:foundation")
          }
          INNER_EOF

          # --- Resources ---
          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Keyboard Pro 2</string>
              <string name="ime_name">Keyboard Pro iOS</string>
          </resources>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.AiKeyboardPro" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:windowTranslucentNavigation">true</item>
              </style>
          </resources>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:supportsInlineSuggestions="true"
              android:isDefault="true" />
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#212121"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0088FF" android:pathData="M20,30h68v48h-68zM30,40h10v10h-10zM45,40h10v10h-10zM60,40h10v10h-10z"/>
          </vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          # --- Source Code ---
          cat << 'INNER_EOF' > app/src/main/java/com/aikeyboard/pro/AiKeyboardService.kt
          package com.aikeyboard.pro

          import android.content.res.Configuration
          import android.inputmethodservice.InputMethodService
          import android.os.Build
          import android.view.View
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.ComposeView
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.*
          import androidx.savedstate.*

          // لتهيئة بيئة Compose داخل Service
          class CustomLifecycleOwner : LifecycleOwner, ViewModelStoreOwner, SavedStateRegistryOwner {
              private val lifecycleRegistry = LifecycleRegistry(this)
              private val savedStateRegistryController = SavedStateRegistryController.create(this)
              private val store = ViewModelStore()
              override val lifecycle: Lifecycle get() = lifecycleRegistry
              override val savedStateRegistry: SavedStateRegistry get() = savedStateRegistryController.savedStateRegistry
              override val viewModelStore: ViewModelStore get() = store
              fun onCreate() { savedStateRegistryController.performRestore(null); lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_CREATE) }
              fun onStart() { lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START) }
              fun onResume() { lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_RESUME) }
              fun onDestroy() { lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_DESTROY) }
          }

          class AiKeyboardService : InputMethodService() {
              private val lifecycleOwner = CustomLifecycleOwner()
              
              // 🔥 هذا هو المتغير التفاعلي الذي سيصلح مشكلة ألوان النهار والليل! 🔥
              private val isDarkThemeState = mutableStateOf(false)

              override fun onCreate() {
                  super.onCreate()
                  lifecycleOwner.onCreate()
                  updateThemeState(resources.configuration)
              }

              // مراقبة تغييرات النظام لحظياً
              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  updateThemeState(newConfig)
              }

              private fun updateThemeState(config: Configuration) {
                  val isNightMode = (config.uiMode and Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                  isDarkThemeState.value = isNightMode
              }

              override fun onCreateInputView(): View {
                  lifecycleOwner.onStart()
                  lifecycleOwner.onResume()

                  return ComposeView(this).apply {
                      setViewTreeLifecycleOwner(lifecycleOwner)
                      setViewTreeViewModelStoreOwner(lifecycleOwner)
                      setViewTreeSavedStateRegistryOwner(lifecycleOwner)
                      
                      setContent {
                          // قراءة حالة اللون من المتغير الذي يتم تحديثه يدوياً
                          val isDarkTheme = isDarkThemeState.value
                          val dynamicColor = Build.VERSION.SDK_INT >= Build.VERSION_CODES.S
                          
                          val colorScheme = when {
                              dynamicColor && isDarkTheme -> dynamicDarkColorScheme(this@AiKeyboardService)
                              dynamicColor && !isDarkTheme -> dynamicLightColorScheme(this@AiKeyboardService)
                              isDarkTheme -> darkColorScheme()
                              else -> lightColorScheme()
                          }

                          MaterialTheme(colorScheme = colorScheme) {
                              Surface(
                                  modifier = Modifier.fillMaxWidth().height(260.dp),
                                  color = MaterialTheme.colorScheme.surfaceVariant // لون الخلفية يتغير تلقائياً
                              ) {
                                  KeyboardUi(
                                      onKeyPress = { text ->
                                          currentInputConnection?.commitText(text, 1)
                                      },
                                      onDelete = {
                                          currentInputConnection?.deleteSurroundingText(1, 0)
                                      }
                                  )
                              }
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  lifecycleOwner.onDestroy()
              }
          }

          // واجهة مبسطة للكيبورد لإثبات نجاح الألوان
          @Composable
          fun KeyboardUi(onKeyPress: (String) -> Unit, onDelete: () -> Unit) {
              val keys = listOf(
                  listOf("Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"),
                  listOf("A", "S", "D", "F", "G", "H", "J", "K", "L"),
                  listOf("Z", "X", "C", "V", "B", "N", "M", "⌫")
              )

              Column(
                  modifier = Modifier.fillMaxSize().padding(vertical = 8.dp),
                  verticalArrangement = Arrangement.SpaceEvenly,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  for (row in keys) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.Center
                      ) {
                          for (key in row) {
                              val isSpecial = key == "⌫"
                              Box(
                                  modifier = Modifier
                                      .padding(horizontal = 3.dp, vertical = 4.dp)
                                      .weight(if (isSpecial) 1.5f else 1f)
                                      .height(48.dp)
                                      .clip(RoundedCornerShape(12.dp))
                                      .background(
                                          if (isSpecial) MaterialTheme.colorScheme.secondaryContainer 
                                          else MaterialTheme.colorScheme.surface
                                      )
                                      .clickable {
                                          if (isSpecial) onDelete() else onKeyPress(key.lowercase())
                                      },
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(
                                      text = key,
                                      fontSize = 20.sp,
                                      fontWeight = FontWeight.Medium,
                                      color = if (isSpecial) MaterialTheme.colorScheme.onSecondaryContainer else MaterialTheme.colorScheme.onSurface
                                  )
                              }
                          }
                      }
                  }
                  
                  // مسطرة المسافة (Space)
                  Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 4.dp), horizontalArrangement = Arrangement.Center) {
                      Box(
                          modifier = Modifier
                              .weight(1f)
                              .height(48.dp)
                              .padding(horizontal = 32.dp, vertical = 4.dp)
                              .clip(RoundedCornerShape(24.dp))
                              .background(MaterialTheme.colorScheme.primaryContainer)
                              .clickable { onKeyPress(" ") },
                          contentAlignment = Alignment.Center
                      ) {
                          Text("Space", color = MaterialTheme.colorScheme.onPrimaryContainer, fontWeight = FontWeight.Bold)
                      }
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro

          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.Keyboard
          import androidx.compose.material.icons.rounded.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.view.WindowCompat

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  
                  setContent { 
                      val darkTheme = isSystemInDarkTheme()
                      val dynamicColor = Build.VERSION.SDK_INT >= Build.VERSION_CODES.S
                      val colorScheme = when {
                          dynamicColor && darkTheme -> dynamicDarkColorScheme(this)
                          dynamicColor && !darkTheme -> dynamicLightColorScheme(this)
                          darkTheme -> darkColorScheme()
                          else -> lightColorScheme()
                      }
                      MaterialTheme(colorScheme = colorScheme) {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              Column(
                                  modifier = Modifier.fillMaxSize().padding(24.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.Center
                              ) {
                                  Icon(Icons.Rounded.Keyboard, contentDescription = null, modifier = Modifier.size(80.dp), tint = MaterialTheme.colorScheme.primary)
                                  Spacer(modifier = Modifier.height(24.dp))
                                  Text("AI Keyboard Pro 2", fontSize = 28.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.onBackground)
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text("Le clavier intelligent ultime.", fontSize = 16.sp, color = MaterialTheme.colorScheme.onBackground.copy(alpha = 0.7f))
                                  
                                  Spacer(modifier = Modifier.height(64.dp))
                                  
                                  Button(
                                      onClick = { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) },
                                      modifier = Modifier.fillMaxWidth().height(56.dp)
                                  ) {
                                      Icon(Icons.Rounded.Settings, contentDescription = null)
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text("Activer le clavier dans les paramètres", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AiKeyboardPro">
                  
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".AiKeyboardService" android:exported="true" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
                  
              </application>
          </manifest>
          INNER_EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Clean & Debug Build
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Publish GitHub Release automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_TAG="v2.0.${{ github.run_number }}.${{ github.run_attempt }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="AiKeyboard-Pro-V2.0.apk"
          
          cp "$APK_PATH" "$APK_NAME"
          
          RELEASE_INTRO=$(cat <<EOF
          > **AI Keyboard Pro 2 $VERSION_TAG**

          ## Quoi de neuf dans V2.0 ?
          - **Dynamic Colors Fix (Jour/Nuit)** : Correction du problème de thème. Le clavier s'adapte désormais instantanément et avec stabilité aux changements de mode sombre/clair du système.
          - **Architecture Tout-en-un** : Projet géré via un pipeline d'intégration continue unifié.

          ## Installation
          Téléchargez et installez l'APK : **[$APK_NAME](https://github.com/${{ github.repository }}/releases/download/$VERSION_TAG/$APK_NAME)**
          EOF
          )
          
          gh release delete "$VERSION_TAG" --cleanup-tag -y || true
          
          gh release create "$VERSION_TAG" "$APK_NAME" \
            --title "AI Keyboard Pro 2 $VERSION_TAG" \
            --notes "$RELEASE_INTRO"
