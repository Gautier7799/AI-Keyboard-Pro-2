              private fun createMenuPill(label: String, iconRes: Int, action: () -> Unit): View {
                  val dp = resources.displayMetrics.density
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (52 * dp).toInt(), 1f).apply { setMargins((6*dp).toInt(), (6*dp).toInt(), (6*dp).toInt(), (6*dp).toInt()) }
                      background = GradientDrawable().apply { setColor(keyNormalFace); setCornerRadius(26f * dp) }
                      isClickable = true; isFocusable = true
                      
                      addView(ImageView(this@KeyboardService).apply {
                          layoutParams = LinearLayout.LayoutParams((22*dp).toInt(), (22*dp).toInt()).apply { marginEnd = (10*dp).toInt() }
