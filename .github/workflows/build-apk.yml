          import android.widget.Toast

          class KeyboardService : InputMethodService() {
              
              private var kbBgColor = Color.parseColor("#D1D4D9")
              private var keyNormalFace = Color.parseColor("#FFFFFF")
              private var keyNormalPressed = Color.parseColor("#B3B8C3")
              private var keyControlFace = Color.parseColor("#B3B8C3")
              private var keyControlPressed = Color.parseColor("#FFFFFF")
              private var keyShadow = Color.parseColor("#898A8D")
              private var txtColor = Color.parseColor("#000000")
              
              private var currentLanguage = 0 
              private var isShifted = false
              private var keyboardMode = 0 
              private var keyHeightDp = 52f 
              
              private lateinit var absoluteRoot: FrameLayout
              private lateinit var rootLayout: LinearLayout
              private lateinit var predictionContainer: LinearLayout
              private lateinit var contentContainer: FrameLayout // حاوية ذكية للمحتوى
              
              private lateinit var keysContainer: LinearLayout
              private lateinit var menuContainer: LinearLayout
              private lateinit var emojiContainer: LinearLayout
              private lateinit var textEditContainer: LinearLayout
              private lateinit var settingsIcon: TextView
              
              private lateinit var popupView: TextView
              private lateinit var optionsContainer: LinearLayout
              private var selectedOptionIndex = -1
              
              private val predictionViews = mutableListOf<TextView>()
              private val handler = Handler(Looper.getMainLooper())

              // قائمة إيموجي حقيقية
              private val emojisList = "😀 😁 😂 🤣 😃 😄 😅 😆 😉 😊 😋 😎 😍 😘 🥰 😗 😙 😚 ☺️ 🙂 🤗 🤩 🤔 🤨 😐 😑 😶 🙄 😏 😣 😥 😮 🤐 😯 😪 😫 😴 😌 😛 😜 😝 🤤 😒 😓 😔 😕 🙃 🤑 😲 ☹️ 🙁 😖 😞 😟 😤 😢 😭 😦 😧 😨 😩 🤯 😬 😰 😱 🥵 🥶 😳 🤪 😵 😡 😠 🤬 😷 🤒 🤕 🤢 🤮 🤧 😇 🤠 🥳 🥴 🥺 🤥 🤫 🤭 🧐 🤓 😈 👿 🤡 👹 👺 💀 ☠️ 👻 👽 👾 🤖 💩 💖 💔 ❤️ 🔥 👍 👎 🙏 👏 🙌 🤝".split(" ")

              private val dictionaryAr = listOf("مرحبا", "شكرا", "السلام", "عليكم", "نعم", "لا", "كيف", "حالك", "إن", "شاء", "الله", "صباح", "الخير", "مساء", "أين", "متى", "لماذا", "جميل", "جدا", "اليوم", "غدا", "الحمد", "لله")
              private val dictionaryFr = listOf("bonjour", "merci", "oui", "non", "comment", "ça", "va", "bien", "salut", "je", "tu", "il", "elle", "nous", "vous", "ils", "elles")
              private val alternateChars = mapOf("ا" to listOf("أ", "إ", "آ", "ء", "ا"), "ي" to listOf("ئ", "ى", "ي"), "و" to listOf("ؤ", "و"), "ى" to listOf("ي", "ئ", "ى"), "ة" to listOf("ه", "ة"), "ه" to listOf("ة", "ه"), "د" to listOf("ذ", "د"), "ل" to listOf("لا", "لأ", "لإ", "لآ", "ل"))

              private fun updateThemeColors() {
                  val isNightMode = (resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                  if (isNightMode) {
                      kbBgColor = Color.parseColor("#1C1C1E"); keyNormalFace = Color.parseColor("#4B4B4B"); keyNormalPressed = Color.parseColor("#2C2C2E"); keyControlFace = Color.parseColor("#2C2C2E"); keyControlPressed = Color.parseColor("#4B4B4B"); keyShadow = Color.parseColor("#111111"); txtColor = Color.parseColor("#FFFFFF")
                  } else {
                      kbBgColor = Color.parseColor("#D1D4D9"); keyNormalFace = Color.parseColor("#FFFFFF"); keyNormalPressed = Color.parseColor("#B3B8C3"); keyControlFace = Color.parseColor("#B3B8C3"); keyControlPressed = Color.parseColor("#FFFFFF"); keyShadow = Color.parseColor("#898A8D"); txtColor = Color.parseColor("#000000")
                  }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  val oldBgColor = kbBgColor; updateThemeColors()
                  if (oldBgColor != kbBgColor) setInputView(onCreateInputView())
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  val prefs = getSharedPreferences("keyboard_prefs", Context.MODE_PRIVATE)
                  val newHeight = prefs.getFloat("key_height", 52f)
                  if (newHeight != keyHeightDp) { keyHeightDp = newHeight; if (::keysContainer.isInitialized) renderKeys() }
                  resetToKeyboard()
                  handler.post { updatePredictions() }
              }

              private fun resetToKeyboard() {
                  if (::contentContainer.isInitialized) {
                      keysContainer.visibility = View.VISIBLE
                      menuContainer.visibility = View.GONE
                      emojiContainer.visibility = View.GONE
                      textEditContainer.visibility = View.GONE
                      settingsIcon.text = "⚙️"
                  }
              }

              override fun onCreateInputView(): View {
                  predictionViews.clear(); updateThemeColors()
                  val dp = resources.displayMetrics.density
                  val prefs = getSharedPreferences("keyboard_prefs", Context.MODE_PRIVATE)
