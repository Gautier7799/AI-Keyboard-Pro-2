          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import androidx.appcompat.app.AppCompatActivity
          import androidx.cardview.widget.CardView
          import com.google.android.material.slider.Slider
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val prefs = getSharedPreferences("keyboard_prefs", Context.MODE_PRIVATE)
                  findViewById<CardView>(R.id.btnEnableCard).setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  val slider = findViewById<Slider>(R.id.heightSlider)
                  slider.value = prefs.getFloat("key_height", 52f)
                  slider.addOnChangeListener { _, value, _ -> prefs.edit().putFloat("key_height", value).apply() }
              }
          }
          EOF

